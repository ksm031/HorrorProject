<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>철거 예정</title>
<meta name="description" content="A short Korean horror pixel-art cutscene: a girl's walk home through a hillside village scheduled for demolition.">
<style>
:root{--bg:#050708;--ink:#c0c6b8;--dim:#717c75;--line:#262c2b;--accent:#da2a2a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:ui-monospace,"SFMono-Regular",Menlo,Consolas,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",monospace;overflow:hidden;-webkit-tap-highlight-color:transparent}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:16px 0}
#frame{position:relative;line-height:0;background:#000}
canvas{display:block;image-rendering:pixelated;image-rendering:crisp-edges;-ms-interpolation-mode:nearest-neighbor}
#veil{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:16px;background:rgba(5,7,8,.62);line-height:1.4}
#veil[hidden],#bar[hidden]{display:none}
h1{margin:0;font-weight:700;font-size:clamp(22px,5vw,44px);letter-spacing:.25em;color:#e6e4d2}
.sub{margin:0;font-size:clamp(11px,1.6vw,14px);letter-spacing:.18em;color:var(--dim)}
.note{margin:0;font-size:clamp(10px,1.3vw,12px);color:var(--dim);max-width:36em}
button{font:inherit;color:var(--ink);background:#0b1213;border:2px solid #3a4341;padding:10px 22px;font-size:clamp(13px,1.6vw,16px);letter-spacing:.12em;cursor:pointer;min-height:44px}
button:hover{border-color:var(--accent);color:#e6e4d2}
button:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:10px;padding:8px 10px;background:rgba(5,7,8,.78);line-height:1;transition:opacity .3s}
#frame.idle #bar{opacity:0}
#frame.idle{cursor:none}
.ic{min-height:36px;min-width:36px;padding:0 8px;border-width:1px;font-size:13px;letter-spacing:0}
#track{flex:1;height:24px;display:flex;align-items:center;cursor:pointer;touch-action:none}
#rail{position:relative;width:100%;height:4px;background:#262c2b}
#fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--accent)}
#time{font-size:12px;color:var(--dim);min-width:72px;text-align:right}
@media (max-width:600px){.note{font-size:10px}h1{letter-spacing:.15em}}
#load{position:absolute;inset:auto 0 14% 0;text-align:center;color:var(--dim);font-size:13px;letter-spacing:.1em;line-height:1.4}
</style>
</head>
<body>
<div id="stage">
  <div id="frame">
    <canvas id="c" width="480" height="270" aria-label="철거 예정 — animated pixel-art cutscene"></canvas>
    <div id="veil" hidden>
      <h1>철거 예정</h1>
      <p class="sub">SCHEDULED FOR DEMOLITION</p>
      <button id="go">▶ 시작 · START</button>
      <p class="note">소리를 켜고 감상하세요 (헤드폰 권장) · 약 78초 · 깜빡이는 빛 효과가 있습니다<br>Sound on, headphones recommended · ~78 s · contains flickering light</p>
    </div>
    <div id="load">준비 중… · preparing</div>
    <div id="bar" hidden>
      <button class="ic" id="pp" aria-label="Pause">❚❚</button>
      <div id="track" role="slider" aria-label="Seek" tabindex="0" aria-valuemin="0" aria-valuemax="78" aria-valuenow="0"><div id="rail"><div id="fill"></div></div></div>
      <span id="time">0:00 / 1:18</span>
      <button class="ic" id="mute" aria-label="Mute">SND</button>
      <button class="ic" id="rp" aria-label="Replay">↺</button>
      <button class="ic" id="fs" aria-label="Fullscreen">⛶</button>
    </div>
  </div>
</div>
<script>
/* ---- 10_core.js ---- */
'use strict';
/* ==========================================================================
   CORE — fixed 480×270 indexed framebuffer, 35-colour palette, primitives.
   Every pixel written anywhere in this file is a palette index on one grid.
   ========================================================================== */
const W = 480, H = 270, T = 255; // T = transparent index for sprite/layer buffers

const HEX = [
  '050708', '0b1213', '102020', '15302f', '1c4340', '255a53', '33736a', '4b8e7f', '74ad98', // 0-8   near-black → teal
  '1b2a19', '2b4022', '405c2b', '5f7d38', '8fa556',                                     // 9-13  moss
  '262c2b', '3a4341', '535e59', '717c75', '96a097', 'c0c6b8', 'e6e4d2',                // 14-20 cement grey → shirt white
  '26080c', '4c0d14', '7a111a', 'ab1620', 'da2a2a', 'f45a32',                           // 21-26 crimson
  '4a2f1a', '9a6a2c', 'e8b84e', 'fff1a6',                                               // 27-30 warm / window yellow
  'a9715a', '6c4136',                                                                   // 31-32 skin
  '1f3d5a', '2e6185'                                                                    // 33-34 water-tank blue
];
const K0 = 0, K1 = 1, T0 = 2, T1 = 3, T2 = 4, T3 = 5, T4 = 6, T5 = 7, T6 = 8,
  M0 = 9, M1 = 10, M2 = 11, M3 = 12, M4 = 13,
  G0 = 14, G1 = 15, G2 = 16, G3 = 17, G4 = 18, G5 = 19, WH = 20,
  R0 = 21, R1 = 22, R2 = 23, R3 = 24, R4 = 25, R5 = 26,
  Y0 = 27, Y1 = 28, Y2 = 29, Y3 = 30, S0 = 31, S1 = 32, B0 = 33, B1 = 34;

// one step darker / lighter along each material ramp (stepped lighting)
const DN = new Uint8Array(256), UP = new Uint8Array(256);
(function () {
  for (let i = 0; i < 256; i++) { DN[i] = i; UP[i] = i; }
  const ramps = [
    [K0, K0, K1, T0, T1, T2, T3, T4, T5, T6],
    [K1, M0, M1, M2, M3, M4],
    [K1, G0, G1, G2, G3, G4, G5, WH],
    [K0, R0, R1, R2, R3, R4],
    [K1, Y0, Y1],
    [Y0, S1, S0],
    [T0, B0, B1, T5]
  ];
  const setU = new Uint8Array(256), setD = new Uint8Array(256);
  for (const r of ramps) for (let i = 1; i < r.length; i++) {
    if (r[i] !== r[i - 1] && !setD[r[i]]) { DN[r[i]] = r[i - 1]; setD[r[i]] = 1; }
    if (!setU[r[i - 1]] && r[i] !== r[i - 1]) { UP[r[i - 1]] = r[i]; setU[r[i - 1]] = 1; } // first ramp owns its anchor
  }
  // emissive colours never take part in lighting
  for (const e of [Y2, Y3, R5]) { DN[e] = e; UP[e] = e; }
  UP[Y1] = Y1; UP[R4] = R4; UP[K0] = K1; DN[K0] = K0;
  UP[T6] = T6; UP[WH] = WH; UP[M4] = M4; UP[S0] = S0;
})();
const EMISSIVE = new Uint8Array(256); EMISSIVE[Y2] = EMISSIVE[Y3] = EMISSIVE[R5] = 1;

// 4×4 ordered dither
const B4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
const bay = (x, y) => (B4[((y & 3) << 2) | (x & 3)] + 0.5) / 16;

// deterministic hashing / noise (renders are pure functions of time)
function hash(x, y, s) {
  let h = (x | 0) * 374761393 + (y | 0) * 668265263 + (s | 0) * 2147483647;
  h = (h ^ (h >>> 13)) * 1274126177; h ^= h >>> 16;
  return (h >>> 0) / 4294967296;
}
function rng(seed) { // mulberry32
  let a = seed >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0; let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
function vnoise(x, y, s) { // value noise, smooth
  const xi = Math.floor(x), yi = Math.floor(y), xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const a = hash(xi, yi, s), b = hash(xi + 1, yi, s), c = hash(xi, yi + 1, s), d = hash(xi + 1, yi + 1, s);
  return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
}
function fbm(x, y, s) { return vnoise(x, y, s) * 0.6 + vnoise(x * 2.1, y * 2.1, s + 7) * 0.3 + vnoise(x * 4.3, y * 4.3, s + 13) * 0.1; }

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const ri = Math.round;

class Buf {
  constructor(w, h, fill = T) { this.w = w; this.h = h; this.d = new Uint8Array(w * h).fill(fill); }
  clone() { const b = new Buf(this.w, this.h); b.d.set(this.d); return b; }
}

/* ---------- primitives (all integer, all clipped) ---------- */
function P(b, x, y, c) { x = ri(x); y = ri(y); if (x < 0 || y < 0 || x >= b.w || y >= b.h) return; b.d[y * b.w + x] = c; }
function G(b, x, y) { x = ri(x); y = ri(y); if (x < 0 || y < 0 || x >= b.w || y >= b.h) return T; return b.d[y * b.w + x]; }
function R(b, x, y, w, h, c) {
  x = ri(x); y = ri(y); w = ri(w); h = ri(h);
  let x0 = Math.max(0, x), y0 = Math.max(0, y), x1 = Math.min(b.w, x + w), y1 = Math.min(b.h, y + h);
  for (let j = y0; j < y1; j++) b.d.fill(c, j * b.w + x0, j * b.w + x1);
}
// dithered rect: lvl 0..1 coverage of colour c
function D(b, x, y, w, h, c, lvl) {
  x = ri(x); y = ri(y); w = ri(w); h = ri(h);
  for (let j = Math.max(0, y); j < Math.min(b.h, y + h); j++)
    for (let i = Math.max(0, x); i < Math.min(b.w, x + w); i++) if (bay(i, j) < lvl) b.d[j * b.w + i] = c;
}
function L(b, x0, y0, x1, y1, c, th = 1) {
  x0 = ri(x0); y0 = ri(y0); x1 = ri(x1); y1 = ri(y1);
  const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let e = dx + dy, o = (th - 1) >> 1;
  for (;;) {
    if (th === 1) P(b, x0, y0, c); else R(b, x0 - o, y0 - o, th, th, c);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; }
  }
}
// scanline polygon fill (pixel-centre rule)
function poly(b, pts, c) {
  let miny = Infinity, maxy = -Infinity;
  for (const p of pts) { miny = Math.min(miny, p[1]); maxy = Math.max(maxy, p[1]); }
  miny = Math.max(0, Math.floor(miny)); maxy = Math.min(b.h - 1, Math.ceil(maxy));
  const xs = [];
  for (let y = miny; y <= maxy; y++) {
    const yc = y + 0.5; xs.length = 0;
    for (let i = 0, n = pts.length; i < n; i++) {
      const a = pts[i], q = pts[(i + 1) % n];
      if ((a[1] <= yc && q[1] > yc) || (q[1] <= yc && a[1] > yc)) xs.push(a[0] + (yc - a[1]) / (q[1] - a[1]) * (q[0] - a[0]));
    }
    xs.sort((m, n) => m - n);
    for (let k = 0; k + 1 < xs.length; k += 2) {
      const xa = Math.max(0, Math.round(xs[k])), xb = Math.min(b.w, Math.round(xs[k + 1]));
      if (xb > xa) b.d.fill(c, y * b.w + xa, y * b.w + xb);
    }
  }
}
function ell(b, cx, cy, rx, ry, c) {
  for (let y = -ry; y <= ry; y++) {
    const hw = Math.round(rx * Math.sqrt(Math.max(0, 1 - (y / (ry + 0.5)) ** 2)));
    R(b, cx - hw, cy + y, hw * 2 + 1, 1, c);
  }
}
function ellO(b, cx, cy, rx, ry, c) { // outline ellipse
  let px = null, py = null;
  for (let a = 0; a <= 64; a++) {
    const t = a / 64 * Math.PI * 2, x = ri(cx + Math.cos(t) * rx), y = ri(cy + Math.sin(t) * ry);
    if (px !== null) L(b, px, py, x, y, c); px = x; py = y;
  }
}
// blit with transparency, optional horizontal flip and colour remap
function blit(dst, src, dx, dy, flip = false, map = null) {
  dx = ri(dx); dy = ri(dy);
  for (let j = 0; j < src.h; j++) {
    const y = dy + j; if (y < 0 || y >= dst.h) continue;
    for (let i = 0; i < src.w; i++) {
      const x = dx + i; if (x < 0 || x >= dst.w) continue;
      let c = src.d[j * src.w + (flip ? src.w - 1 - i : i)];
      if (c === T) continue; if (map) c = map[c]; dst.d[y * dst.w + x] = c;
    }
  }
}
// copy a window of a large layer onto dst (camera scroll), integer offsets only
function layer(dst, src, ox, oy) {
  ox = ri(ox); oy = ri(oy);
  for (let y = 0; y < dst.h; y++) {
    const sy = y + oy; if (sy < 0 || sy >= src.h) continue;
    const row = sy * src.w;
    for (let x = 0; x < dst.w; x++) {
      const sx = x + ox; if (sx < 0 || sx >= src.w) continue;
      const c = src.d[row + sx]; if (c !== T) dst.d[y * dst.w + x] = c;
    }
  }
}
function remapRect(b, x, y, w, h, map) {
  for (let j = Math.max(0, y); j < Math.min(b.h, y + h); j++)
    for (let i = Math.max(0, x); i < Math.min(b.w, x + w); i++) { const k = j * b.w + i; if (b.d[k] !== T) b.d[k] = map[b.d[k]]; }
}
// 1px outline around opaque pixels of a sprite buffer (returns new buffer with 1px margin)
function outline(src, c, skipBottom = false) {
  const o = new Buf(src.w + 2, src.h + 2);
  blit(o, src, 1, 1);
  const d = o.d, w = o.w, h = o.h, add = [];
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    if (d[y * w + x] !== T) continue;
    const n = (x > 0 && d[y * w + x - 1] !== T) || (x < w - 1 && d[y * w + x + 1] !== T) ||
      (y > 0 && d[(y - 1) * w + x] !== T) || (!skipBottom && y < h - 1 && d[(y + 1) * w + x] !== T);
    if (n) add.push(y * w + x);
  }
  for (const k of add) d[k] = c;
  return o;
}
// sprite from ASCII art; key maps chars to palette indices
function spr(rows, key) {
  const h = rows.length, w = Math.max(...rows.map(r => r.length)), b = new Buf(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < rows[y].length; x++) {
    const ch = rows[y][x]; if (ch === '.' || ch === ' ') continue;
    if (key[ch] === undefined) throw new Error('sprite key ' + ch); b.d[y * w + x] = key[ch];
  }
  return b;
}
// textured fill: value-noise banded into a ramp + speckle
function tex(b, x, y, w, h, ramp, seed, sc = 0.08, speck = 0.05) {
  x = ri(x); y = ri(y);
  for (let j = Math.max(0, y); j < Math.min(b.h, y + h); j++)
    for (let i = Math.max(0, x); i < Math.min(b.w, x + w); i++) {
      let v = fbm(i * sc, j * sc * 1.4, seed) * ramp.length;
      v += (bay(i, j) - 0.5) * 0.55;
      let k = clamp(Math.floor(v), 0, ramp.length - 1);
      const r = hash(i, j, seed + 3);
      if (r < speck) k = Math.max(0, k - 1); else if (r > 1 - speck * 0.5) k = Math.min(ramp.length - 1, k + 1);
      b.d[j * b.w + i] = ramp[k];
    }
}
// hairline crack, random walk downward with occasional branch
function crack(b, x, y, len, c, seed, dir = 1) {
  const r = rng(seed); let cx = x, cy = y;
  for (let i = 0; i < len; i++) {
    P(b, cx, cy, c);
    cy += dir; if (r() < 0.45) cx += r() < 0.5 ? -1 : 1;
    if (r() < 0.05 && len - i > 6) crack(b, cx, cy, (len - i) >> 1, c, seed + i * 31, dir);
  }
}
// stain streaks running down from a line (rust / water)
function streaks(b, x, y, w, maxLen, c, seed, dens = 0.3) {
  for (let i = 0; i < w; i++) {
    if (hash(x + i, y, seed) > dens) continue;
    const l = 2 + Math.floor(hash(x + i, y, seed + 1) * maxLen);
    for (let j = 0; j < l; j++) if (bay(x + i, y + j) < 1 - j / l * 0.8) P(b, x + i, y + j, c);
  }
}

/* ---- 15_text.js ---- */
/* ==========================================================================
   HANGUL — hand-drawn 14×14 pixel bitmaps (1px strokes) on the shared grid.
   Only syllables actually used: 철 거 예 정 · 출 입 금 지 · 공 가 · 위 험
   ========================================================================== */
const GLYPH = {
  '철': ['...#.......#..', '#######....#..', '...#.......#..', '..#.#...####..', '.#...#.....#..', '#.....#....#..', '...........#..', '..............',
    '.##########...', '..........#...', '.##########...', '.#............', '.##########...', '..............'],
  '거': ['...........#..', '...........#..', '#######....#..', '......#....#..', '......#....#..', '.....#.....#..', '.....#..####..',
    '....#......#..', '...#.......#..', '..#........#..', '.#.........#..', '#..........#..', '...........#..', '...........#..'],
  '예': ['.........#..#.', '.........#..#.', '.........#..#.', '..###....#..#.', '.#...#.###..#.', '#.....#..#..#.', '#.....#..#..#.',
    '#.....#..#..#.', '.#...#.###..#.', '..###....#..#.', '.........#..#.', '.........#..#.', '.........#..#.', '.........#..#.'],
  '정': ['...........#..', '#######....#..', '...#.......#..', '..#.#...####..', '.#...#.....#..', '#.....#....#..', '...........#..',
    '...........#..', '....#####.....', '...#.....#....', '..#.......#...', '...#.....#....', '....#####.....', '..............'],
  '공': ['.###########..', '...........#..', '...........#..', '...........#..', '......#.......', '......#.......', '#############.',
    '..............', '....#####.....', '...#.....#....', '..#.......#...', '...#.....#....', '....#####.....', '..............'],
  '가': ['.........#....', '.........#....', '#######..#....', '......#..#....', '......#..#....', '.....#...#....', '.....#...####.',
    '....#....#....', '...#.....#....', '..#......#....', '.#.......#....', '#........#....', '.........#....', '.........#....'],
  '출': ['......#.......', '..#########...', '......#.......', '.....#.#......', '...##...##....', '..............', '#############.',
    '......#.......', '..............', '..#########...', '..........#...', '..#########...', '..#...........', '..#########...'],
  '입': ['..###......#..', '.#...#.....#..', '#.....#....#..', '#.....#....#..', '#.....#....#..', '.#...#.....#..', '..###......#..',
    '...........#..', '..............', '..#.......#...', '..#.......#...', '..#########...', '..#.......#...', '..#########...'],
  '금': ['.###########..', '...........#..', '...........#..', '..............', '#############.', '..............', '..#########...',
    '..#.......#...', '..#.......#...', '..#.......#...', '..#.......#...', '..#########...', '..............', '..............'],
  '지': ['..........#...', '..........#...', '########..#...', '....#.....#...', '....#.....#...', '...#.#....#...', '...#.#....#...',
    '..#...#...#...', '..#...#...#...', '.#.....#..#...', '#.......#.#...', '..........#...', '..........#...', '..........#...'],
  '위': ['....###....#..', '...#...#...#..', '..#.....#..#..', '...#...#...#..', '....###....#..', '...........#..', '##########.#..',
    '.....#.....#..', '.....#.....#..', '.....#.....#..', '.....#.....#..', '.....#.....#..', '...........#..', '...........#..'],
  '험': ['...#.......#..', '.#####.....#..', '..###......#..', '.#...#..####..', '..###......#..', '...........#..', '...........#..',
    '...........#..', '..#########...', '..#.......#...', '..#.......#...', '..#.......#...', '..#########...', '..............']
};
// draw one 14×14 syllable; bold doubles strokes rightward; spray adds specks + drips
function glyph(b, ch, x, y, c, o = {}) {
  const g = GLYPH[ch]; if (!g) return;
  const r = rng(o.seed || (x * 31 + y)); let drips = 0;
  for (let j = 0; j < 14; j++) for (let i = 0; i < 14; i++) {
    if (g[j][i] !== '#') continue;
    P(b, x + i, y + j, c); if (o.bold) P(b, x + i + 1, y + j, c);
    if (o.spray) {
      if (r() < 0.025) P(b, x + i + ri((r() - 0.5) * 7), y + j + ri((r() - 0.5) * 7), c);
      const below = j < 13 && g[j + 1][i] === '#', above = j > 0 && g[j - 1][i] === '#';
      const end = !below && (above || (i < 13 && g[j][i + 1] !== '#') || (i > 0 && g[j][i - 1] !== '#'));

function acUnit(b, x, y) { R(b, x, y, 14, 10, G3); R(b, x, y, 14, 1, G4); ellO(b, x + 5, y + 5, 3, 3, G1); R(b, x + 10, y + 2, 3, 6, G2); R(b, x + 1, y + 10, 2, 2, G1); R(b, x + 11, y + 10, 2, 2, G1); }

/* ==========================================================================
   GIRL — one design, three generators that share proportions & colours:
   side view (keyed skeleton, 46px), back view (scalable shapes), tiny (ASCII).
   ========================================================================== */
const HAIR = K1, HAIRH = T1, SHIRT = WH, SHIRTS = G5, SHIRTD = G4, SKIRT = T1, SKIRTD = T0, SKIRTH = T2,
  SKIN = S0, SKIND = S1, SOCK = K1, SHOE = K0, PACK = R3, PACKD = R2, PACKH = R4, PACKDD = R1;

const D2R = Math.PI / 180;
function limb(b, x, y, a1, l1, a2, l2) { // returns joints
  const kx = x + Math.sin(a1 * D2R) * l1, ky = y + Math.cos(a1 * D2R) * l1;
  const ex = kx + Math.sin(a2 * D2R) * l2, ey = ky + Math.cos(a2 * D2R) * l2;
  return [kx, ky, ex, ey];
}

/* ---- side-view head sprites (facing right). h hair, H sheen, s skin, d skin shade, e eye ---- */
const HEADK = { h: HAIR, H: HAIRH, s: SKIN, d: SKIND, e: K0, k: K0 };

/* ---- keyed cycles (hand-keyed angles, deg; + = forward) ---- */
const WALK = {
  th: [24, 16, 4, -10, -20, -14, 6, 20], kn: [4, 14, 8, 6, 18, 44, 52, 22],
  ft: [-14, 0, 0, 0, 26, 34, 8, -8], bob: [0, 1, 0, 0, 0, 1, 0, 0],

};
const RUN = {
  th: [34, 18, -6, -28, -26, 4, 38, 46], kn: [10, 34, 18, 18, 86, 110, 82, 32],
  ft: [-10, 0, 12, 40, 52, 30, 0, -12], bob: [0, 2, 1, -1, 0, 2, 1, -1],
  au: [-36, -22, 4, 28, 34, 10, -24, -40], af: [70, 76, 92, 104, 108, 96, 80, 70],
  lean: 4, hair: [2, 3, 3, 2, 2, 3, 3, 2], pack: [0, 1, 2, 1, 0, 1, 2, 1]
};
const CLIMB = { // running up stairs: higher knee drive, steeper lean
  th: [40, 26, 4, -18, -14, 14, 50, 54], kn: [36, 44, 20, 14, 80, 110, 96, 60],
  ft: [0, 0, 6, 30, 46, 30, 6, 0], bob: [1, 2, 1, -1, 1, 2, 1, -1],
  au: [-32, -18, 6, 26, 30, 10, -20, -36], af: [72, 78, 92, 104, 108, 96, 82, 72],
  lean: 5, hair: [2, 3, 3, 2, 2, 3, 3, 2], pack: [0, 1, 2, 1, 0, 1, 2, 1]
};

function girlSidePose(cyc, f) {
  const n = 8, a = f % n, b2 = (f + 4) % n;
  return {
    bob: cyc.bob[a], lean: cyc.lean, hair: cyc.hair[a], pack: cyc.pack[a],
    legN: [cyc.th[a], cyc.kn[a], cyc.ft[a]], legF: [cyc.th[b2], cyc.kn[b2], cyc.ft[b2]],
    armN: [cyc.au[a], cyc.af[a]], armF: [cyc.au[b2], cyc.af[b2]], run: cyc !== WALK, head: cyc === WALK ? HEAD_SIDE : HEAD_SIDE_RUN
  };
}
const STAND = { bob: 0, lean: 0, hair: 0, pack: 0, legN: [3, 2, 0], legF: [-3, 2, 0], armN: [-2, 4], armF: [2, 4], run: false, head: HEAD_SIDE };
const STOP_UP = { bob: 0, lean: -1, hair: 0, pack: 0, legN: [4, 3, 0], legF: [-4, 2, 0], armN: [2, 6], armF: [-2, 4], run: false, head: HEAD_SIDE_UP };

function drawGirlSide(p) {
  const b = new Buf(44, 62), ox = 20, oy = 59; // feet baseline
  const hipY = oy - 23 + p.bob, hipX = ox, shX = ox + p.lean, shY = oy - 39 + p.bob;
  const leg = (L, dark) => {
    const [th, kn, ft] = L, hx = hipX + (dark ? -1 : 1);
    const [kx, ky, ax, ay] = limb(b, hx, hipY, th, 11, th - kn, 11);
    const sk = dark ? SKIND : SKIN;
    L_(kx, ky, hx, hipY, sk, 3);
    L_(kx, ky, ax, ay, sk, 2);
    // sock: lower 5px of shin
    const sx = lerp(ax, kx, 0.5), sy = lerp(ay, ky, 0.5);
    L_(ax, ay, sx, sy, dark ? K0 : SOCK, 2);
    // shoe
    const fa = (90 - ft) * D2R, fx = ax + Math.sin(fa) * 4, fy = ay + Math.cos(fa) * 4;
    L_(ax - 1, ay + 1, fx, fy + 1, SHOE, 2);
    if (!dark) P(b, ri(fx), ri(fy), G0);
    return [kx, ky];
  };
  function L_(x0, y0, x1, y1, c, th) { L(b, x0, y0, x1, y1, c, th); }
  const arm = (A, dark) => {
    const [au, af] = A, sx = shX + (dark ? 1 : 0), sy = shY + 2;
    const [ex, ey, hx, hy] = limb(b, sx, sy, au, 8, au + af, 7);
    L_(sx, sy, ex, ey, dark ? SKIND : SKIN, 2);
    L_(ex, ey, hx, hy, dark ? SKIND : SKIN, 2);
    // short sleeve
    const mx = lerp(sx, ex, 0.55), my = lerp(sy, ey, 0.55);
    L_(sx, sy - 1, mx, my, dark ? SHIRTD : SHIRT, 3);
    if (!dark) P(b, ri(mx), ri(my) + 1, SHIRTS);
  };
  // far side
  arm(p.armF, true);
  const kF = leg(p.legF, true);
  const kN = leg(p.legN, false);
  // torso
  poly(b, [[shX - 3, shY], [shX + 3, shY], [shX + 4, shY + 4], [hipX + 3, hipY - 3], [hipX - 3, hipY - 3]], SHIRT);
  R(b, hipX - 3, hipY - 5, 2, 2, SHIRTS);
  L(b, shX - 3, shY + 1, hipX - 3, hipY - 4, SHIRTS);
  P(b, shX + 2, shY, SHIRTS); P(b, shX + 3, shY + 1, R2); P(b, shX + 3, shY + 2, R3); // collar & ribbon
  // skirt (hem follows thighs; trails when running)
  const fr = Math.max(kN[0], kF[0]) + 2, bk = Math.min(kN[0], kF[0]) - 2;
  const hemY = hipY + 9, trail = p.run ? 2 : 0;
  poly(b, [[hipX - 3, hipY - 4], [hipX + 4, hipY - 4], [Math.max(fr, hipX + 4), hemY], [Math.min(bk, hipX - 4) - trail, hemY - trail]], SKIRT);
  for (let i = -3; i <= 4; i += 2) L(b, hipX + i, hipY - 2, hipX + i + (i > 0 ? 1 : -1) * 2, hemY - 1, SKIRTD);
  L(b, hipX - 3, hipY - 4, hipX + 4, hipY - 4, SKIRTD);
  P(b, hipX + 2, hipY - 3, SKIRTH); P(b, hipX + 3, hipY - 1, SKIRTH);
  // backpack (lags the body by a frame → overlapping motion)
  const py = shY + 1 + p.pack, px = shX - 9 - (p.run ? 1 : 0);
  poly(b, [[px + 1, py], [px + 6, py], [px + 7, py + 1], [px + 7, py + 13], [px, py + 13], [px, py + 1]], PACK);
  R(b, px, py + 9, 7, 4, PACKD); R(b, px, py + 8, 2, 5, PACKD);
  L(b, px + 1, py, px + 5, py, PACKH); P(b, px, py + 1, PACKH);
  L(b, px + 1, py + 8, px + 6, py + 8, PACKDD); P(b, px + 4, py + 10, G2);
  L(b, shX - 2, shY, shX + 1, shY + 1, PACKD); L(b, shX + 1, shY + 1, shX, shY + 7, PACKD);
  // near arm over everything but head
  arm(p.armN, false);
  // head (hair trails back with lag)
  const hd = p.head;
  blit(b, hd, shX - 5, shY - 11, false);
  if (p.hair > 1) { P(b, shX - 6, shY - 4, HAIR); P(b, shX - 7, shY - 5, HAIR); if (p.hair > 2) P(b, shX - 7, shY - 3, HAIR); }
  return outline(b, K0);
}

/* frame caches */
const girlCache = new Map();
function girlFrame(name, f) {
  const key = name + f; let s = girlCache.get(key); if (s) return s;
  const cyc = { walk: WALK, run: RUN, climb: CLIMB }[name];
  s = cyc ? drawGirlSide(girlSidePose(cyc, f)) : drawGirlSide(name === 'up' ? STOP_UP : STAND);
  girlCache.set(key, s); return s;
}
// draw side sprite with feet at (x,y)
function girlSide(b, name, f, x, y, flip = false, map = null) {
  const s = girlFrame(name, f);
  blit(b, s, ri(x) - (flip ? s.w - 21 : 21), ri(y) - 60, flip, map);
}

/* ---- back view: scalable, same proportions (unit = 1px at 46px height) ----
   o: {s:scale, yaw:0..1 head turn to her right, up:0..1 look up, breath:0/1, sway:-1..1 hair/pack lag} */
function girlBack(b, cx, fy, o) {
  const s = o.s, yaw = o.yaw || 0, up = o.up || 0, br = o.breath || 0, sw = o.sway || 0;
  const X = u => cx + u * s, Y = u => fy + u * s;
  const pg = (pts, c) => poly(b, pts.map(q => [X(q[0]), Y(q[1])]), c);
  const rr = (x, y, w, h, c) => R(b, ri(X(x)), ri(Y(y)), Math.max(1, ri(w * s)), Math.max(1, ri(h * s)), c);
  const sp = o.spread || 0; // legs apart (stopped mid-step)
  // shadow on ground
  for (let i = -8; i <= 8; i++) { const hgt = Math.max(1, ri(s * (0.9 - Math.abs(i) / 12))); if (Math.abs(i) < 7 || (i & 1)) R(b, ri(X(i)), ri(Y(0.5)) - hgt + 1, ri(s) + 1, hgt, K0); }
  // legs
  for (const side of [-1, 1]) {
    const lx = side * (2.3 + sp * 0.5), sk = side > 0 ? SKIND : SKIN;
    pg([[lx - 1.4, -13], [lx + 1.4, -13], [lx + 1.1, -6], [lx + 0.9, -1.2], [lx - 0.9, -1.2], [lx - 1.1, -6]], sk);
    if (side < 0) pg([[lx + 0.4, -12], [lx + 1.4, -12], [lx + 1.1, -6], [lx + 0.7, -6]], SKIND);
    pg([[lx - 1.15, -6.5], [lx + 1.15, -6.5], [lx + 1.0, -1], [lx - 1.0, -1]], SOCK);
    rr(lx - 1.0, -6.6, 2.0, 0.5, K0);
    pg([[lx - 1.2, -1.4], [lx + 1.2, -1.4], [lx + 1.4, 0.2], [lx - 1.4, 0.2]], SHOE);
    rr(lx - 0.8, -1.3, 1.2, 0.4, G0);
  }
  // arms hang beside the skirt
  for (const side of [-1, 1]) {
    const ax = side * 5.0 + sw * 0.2;
    pg([[ax - 0.9, -32], [ax + 0.9, -32], [ax + 1.0 * side + 0.2, -21.5], [ax + side * 0.2 - 1.0, -21.5]], side > 0 ? SKIND : SKIN);
    pg([[ax - 1.0, -22.4], [ax + 1.0, -22.4], [ax + 0.8, -20.3], [ax - 0.8, -20.3]], side > 0 ? SKIND : SKIN);
  }
  // skirt with pleats
  pg([[-4.6, -25.6], [4.6, -25.6], [6.6, -12.4], [-6.6, -12.4]], SKIRT);
  for (let i = -6; i <= 6; i++) {
    const xt = i * 0.72, xb = i * 1.02;
    L(b, X(xt), Y(-24.8), X(xb), Y(-12.8), i % 2 ? SKIRTD : SKIRTH);
  }
  pg([[2, -25.6], [4.6, -25.6], [6.6, -12.4], [3.4, -12.4]], SKIRTD);
  for (let i = 0; i < 13; i++) if (i % 2) R(b, ri(X(-6.6 + i * 1.02)), ri(Y(-12.9)), Math.max(1, ri(s)), Math.max(1, ri(s * 0.6)), SKIRTD);
  rr(-4.6, -25.8, 9.2, 0.9, SKIRTD);
  // shirt torso
  const bt = br * 0.25;
  pg([[-5.2, -35 - bt], [5.2, -35 - bt], [5.6, -31], [4.7, -25.2], [-4.7, -25.2], [-5.6, -31]], SHIRT);
  pg([[2.6, -34], [5.2, -35 - bt], [5.6, -31], [4.7, -25.2], [2.2, -25.2]], SHIRTS);
  rr(-4.7, -26.4, 9.4, 1.0, SHIRTS);
  // sleeves
  for (const side of [-1, 1]) {
    const x0 = side * 4.6;
    pg([[x0, -35 - bt], [x0 + side * 1.9, -33.6], [x0 + side * 2.3, -30.4], [x0 + side * 0.1, -30.6]].map(q => [q[0], q[1]]), side > 0 ? SHIRTS : SHIRT);
    L(b, X(x0 + side * 2.3), Y(-30.4), X(x0 + side * 0.2), Y(-30.6), SHIRTD);
  }
  // neck + collar
  rr(-1.1, -37.3 - bt, 2.2, 2.6, SKIND);
  pg([[-2.4, -35.6 - bt], [0, -34.6 - bt], [2.4, -35.6 - bt], [2.2, -34.6 - bt], [0, -33.8 - bt], [-2.2, -34.6 - bt]], SHIRT);
  // backpack (lags: sway)
  const pk = sw * 0.35 - yaw * 0.8, pb = br * 0.15;
  const bx = -4.4 + pk, by = -34.2 - pb;
  pg([[bx + 0.8, by], [bx + 8, by], [bx + 8.8, by + 1.2], [bx + 8.8, by + 12.6], [bx + 8.2, by + 13.4], [bx + 0.6, by + 13.4], [bx, by + 12.6], [bx, by + 1.2]], PACK);
  pg([[bx + 5.8, by + 0.6], [bx + 8.8, by + 1.2], [bx + 8.8, by + 12.6], [bx + 8.2, by + 13.4], [bx + 6.4, by + 13.4]], PACKD);
  L(b, X(bx + 1), Y(by + 0.2), X(bx + 6.4), Y(by + 0.2), PACKH);
  L(b, X(bx + 0.3), Y(by + 1.2), X(bx + 0.3), Y(by + 6), PACKH);
  // outer pocket
  pg([[bx + 1.3, by + 6.8], [bx + 7.6, by + 6.8], [bx + 7.6, by + 12.2], [bx + 1.3, by + 12.2]], PACKD);
  pg([[bx + 1.3, by + 6.8], [bx + 5.6, by + 6.8], [bx + 5.6, by + 11.6], [bx + 1.3, by + 11.6]], PACK);
  L(b, X(bx + 1.3), Y(by + 6.8), X(bx + 7.6), Y(by + 6.8), PACKDD);
  L(b, X(bx + 1.6), Y(by + 7.4), X(bx + 7.2), Y(by + 7.4), G2);
  rr(bx + 7.0, by + 7.2, 0.6, 1.4, G3);
  // top handle and shoulder straps
  pg([[bx + 3.3, by - 0.9], [bx + 5.5, by - 0.9], [bx + 5.5, by + 0.2], [bx + 3.3, by + 0.2]], PACKD);
  for (const side of [-1, 1]) {
    const sx = side * 3.8 + pk * 0.4;
    pg([[sx - 0.6, -35.1 - bt], [sx + 0.6, -35.1 - bt], [sx + 0.7, by + 0.6], [sx - 0.7, by + 0.6]], PACKD);
  }
  rr(bx + 0.2, by + 13.2, 8.4, 0.5, PACKDD);
  // head (narrower than shoulders, rounded bob)
  const hx = yaw * 0.5, hy = -up * 0.9, hz = hy * 0.4;
  const hb = [[-3.9, -37.2], [-4.5, -38.6], [-4.6, -41.2], [-4.3, -43.6], [-3.4, -45.5], [-1.8, -46.5], [0, -46.8],
    [1.8, -46.5], [3.4, -45.5], [4.3, -43.6], [4.6, -41.2], [4.5, -38.6], [3.9, -37.2], [0, -36.9]];
  if (up > 0) pg([[-2.6, -37.6 + hz], [2.6, -37.6 + hz], [2.2, -36.2], [-2.2, -36.2]], SKIND); // nape shows as head tilts back
  pg(hb.map(q => [q[0] + hx, q[1] + (q[1] < -41 ? hy : hz)]), HAIR);
  // turning: cheek, lashes and nose tip emerge just past the hair edge
  if (yaw > 0.15) {
    const f = yaw, xr = 4.3 + hx;
    pg([[xr - 0.7, -41.8 + hz], [xr + 0.3 + f * 0.8, -41.3 + hz], [xr + 0.6 + f * 1.3, -40.2 + hz], [xr + 0.3 + f * 0.9, -39.2 + hz],
      [xr + 0.1 + f * 0.7, -38.2 + hz], [xr - 0.8, -37.4 + hz], [xr - 1.0, -40 + hz]], SKIN);
    L(b, X(xr - 0.8), Y(-39.4 + hz), X(xr - 0.6), Y(-37.8 + hz), SKIND);
    if (f > 0.55) {
      pg([[xr + 0.5 + f * 1.2, -40.6 + hz], [xr + 0.9 + f * 1.6, -39.8 + hz], [xr + 0.4 + f * 1.1, -39.4 + hz]], SKIN);
      L(b, X(xr - 0.2), Y(-41.0 + hz), X(xr + 0.2 + f * 0.4), Y(-41.0 + hz), K0);

  }
  // sheen arc and a few strands
  const sy = -44.6 + hy;
  pg([[-3.0 + hx, sy + 0.6], [-1.6 + hx, sy - 0.6], [0.6 + hx, sy - 0.9], [2.4 + hx, sy - 0.2], [2.8 + hx, sy + 0.5], [0.8 + hx, sy + 0.1], [-1.4 + hx, sy + 0.4]], HAIRH);
  for (const i of [-2.4, -0.8, 1.0, 2.6]) L(b, X(i + hx), Y(-42.6 + hy), X(i * 1.08 + hx), Y(-38.0 + hz), K0);
  for (const i of [-3.2, 3.0]) L(b, X(i + hx), Y(-41.6 + hy), X(i * 1.05 + hx), Y(-38.4 + hz), HAIRH);

  for (let i = -3; i <= 3; i += 2) rr(i * 1.1 + hx - 0.3, -37.4 + hz + sw * 0.08 * i, 0.7, 0.6, HAIR);
}

  for (const g of S4_GHOST) ev(g[0], 'thud', { v: 0.5 });

  for (let k = 0; k < 11; k++) ev(S5_RISE_T + k / 2.2, 'thud', { v: 0.35 + k * 0.05 });
  for (const t of S5_SNAP) ev(t, 'snap');

}
// layer gains as a function of film time (sampled ahead by the scheduler)
function layerGains(t) {
  const silent = t >= 60.5 && t < 68.2; // the dead end: total silence

  if (t < 15.0) out.cicada = t < 2 ? 0.3 * t / 2 : t < 9 ? 0.3 : 0.22; // cicadas stop dead at the first blackout
  if (t < 60.5) out.air = t < 24 ? 0.08 : t < 33.5 ? 0.04 : 0.07;
  if (t < 60.5) out.hum = t < 9 ? 0.02 : t < 24 ? 0.035 : t < 33.5 ? 0.07 : t < 48.5 ? 0.03 : 0.05;
  if (t >= 9 && t < 24) out.buzz = s2LampOn(t) ? 0.022 : 0;

/* ---- transport ---- */
function auNow() { return AU.ctx ? AU.ctx.currentTime - AU.t0 : 0; }

  while (AU.cursor < AU.events.length && AU.events[AU.cursor].t < ahead) {
    const e = AU.events[AU.cursor++]; if (e.t >= now - 0.03) SFX[e.k](Math.max(AU.ctx.currentTime, base + e.t), e.o);
  }
  // layers: sample the score at small steps across the lookahead window
  for (let k = 0; k <= 4; k++) {
    const tt = now + k * 0.05, g = layerGains(tt), when = Math.max(AU.ctx.currentTime, base + tt);
    for (const n in g) AU.layers[n].gain.setTargetAtTime(AU.muted ? 0 : g[n], when, 0.012);

}
function auSeek(t) {
  if (!AU.ctx) return;
  for (const n of AU.active) { try { n.stop(); } catch (e) { } } AU.active.clear();
  for (const n in AU.layers) { const g = AU.layers[n].gain; g.cancelScheduledValues(0); g.setValueAtTime(0, AU.ctx.currentTime); }
  const silentAt = (t >= 60.56 && t < 68.19) || t >= 74.6;
  AU.master.gain.cancelScheduledValues(0); AU.master.gain.setValueAtTime(silentAt || AU.muted ? 0 : 0.9, AU.ctx.currentTime);

}

// offline render of the whole score (verification only: levels, silences, clipping)
async function auOffline(sr = 22050) {
  const ctx = new OfflineAudioContext(2, sr * DURATION, sr); auInit(ctx); AU.t0 = 0;
  for (const e of AU.events) SFX[e.k](e.t, e.o);
  for (let t = 0; t < DURATION; t += 0.05) { const g = layerGains(t); for (const n in g) AU.layers[n].gain.setValueAtTime(g[n], t); }
  const buf = await ctx.startRendering(), L = buf.getChannelData(0), Rr = buf.getChannelData(1), out = [];
  for (let s = 0; s < DURATION; s += 0.5) { let pk = 0, ss = 0, n = 0; for (let i = Math.floor(s * sr); i < Math.min(L.length, Math.floor((s + 0.5) * sr)); i++) { const v = Math.max(Math.abs(L[i]), Math.abs(Rr[i])); pk = Math.max(pk, v); ss += L[i] * L[i]; n++; } out.push([s, pk, Math.sqrt(ss / Math.max(1, n))]); }
  return out;
}

/* ---- 70_player.js ---- */
/* ==========================================================================
   PLAYER — integer-scaled canvas, start / pause / seek / replay, keyboard.
   ========================================================================== */
(function () {
  const $ = id => document.getElementById(id);
  const cv = $('c'), cx = cv.getContext('2d', { alpha: false }), frame = $('frame'), veil = $('veil'), bar = $('bar');
  cx.imageSmoothingEnabled = false;
  const img = cx.createImageData(W, H), u32 = new Uint32Array(img.data.buffer), pal = new Uint32Array(256);
  HEX.forEach((h, i) => { pal[i] = (255 << 24) | (parseInt(h.slice(4, 6), 16) << 16) | (parseInt(h.slice(2, 4), 16) << 8) | parseInt(h.slice(0, 2), 16); });
  function present() { const d = fb.d; for (let i = 0; i < d.length; i++) u32[i] = pal[d[i]]; cx.putImageData(img, 0, 0); }
  // whole-number scaling only, measured in device pixels

    const k = Math.max(1, Math.floor(Math.min(vw / W, vh / H)));

  window.addEventListener('resize', fit); fit();

  // clock: the audio clock when we have one, a performance clock otherwise
  let state = 'idle', pc0 = 0, pAt = 0, lastQ = -1, ended = false, poster = null;
  const now = () => state === 'idle' ? (poster !== null ? poster : pAt) : AU.ctx ? (AU.ctx.state === 'running' ? auNow() : pAt) : (state === 'playing' ? (performance.now() - pc0) / 1000 : pAt);
  function seek(t) {
    t = clamp(t, 0, DURATION - 0.01); ended = false; pAt = t; lastQ = -1;
    if (AU.ctx) auSeek(t); pc0 = performance.now() - t * 1000;
  }
  async function play() {
    try { auInit(); } catch (e) { AU.ctx = null; }
    if (ended) seek(0);
    if (AU.ctx) { if (state === 'idle') auSeek(pAt); await AU.ctx.resume().catch(() => { }); if (state !== 'idle') { AU.t0 = AU.ctx.currentTime - pAt; } }
    else pc0 = performance.now() - pAt * 1000;
    state = 'playing'; poster = null; veil.hidden = true; bar.hidden = false; $('pp').textContent = '❚❚'; $('pp').setAttribute('aria-label', 'Pause'); wake();
  }
  function pause() {
    if (state !== 'playing') return; pAt = now(); state = 'paused';
    if (AU.ctx) AU.ctx.suspend(); $('pp').textContent = '▶'; $('pp').setAttribute('aria-label', 'Play'); frame.classList.remove('idle');
  }
  function toggle() { if (state === 'playing') pause(); else play(); }
  function replay() { seek(0); if (AU.ctx) AU.t0 = AU.ctx.currentTime; play(); }
  function finish() {
    ended = true; state = 'paused'; pAt = DURATION; if (AU.ctx) AU.ctx.suspend();
    veil.querySelector('h1').textContent = '철거 예정'; $('go').textContent = '↺ 다시 보기 · REPLAY'; veil.hidden = false; frame.classList.remove('idle');
  }
  let idleT = 0; function wake() { frame.classList.remove('idle'); clearTimeout(idleT); idleT = setTimeout(() => { if (state === 'playing') frame.classList.add('idle'); }, 2200); }
  const fmt = t => Math.floor(t / 60) + ':' + String(Math.floor(t % 60)).padStart(2, '0');
  function loop() {
    requestAnimationFrame(loop);
    if (state === 'playing') auSchedule();
    let t = now();
    if (state === 'playing' && t >= DURATION) { finish(); t = DURATION; }
    const q = Math.floor(t * 24); // picture changes at most 24×/s (holds and steps, never smooth)
    if (q !== lastQ) { lastQ = q; renderAt(Math.min(t, DURATION - 0.001)); present(); }
    if (state === 'idle') return;
    $('fill').style.width = (t / DURATION * 100) + '%'; $('time').textContent = fmt(t) + ' / ' + fmt(DURATION);
    $('track').setAttribute('aria-valuenow', Math.round(t));
  }
  // controls
  $('go').addEventListener('click', e => { e.stopPropagation(); ended ? replay() : play(); });
  $('pp').addEventListener('click', e => { e.stopPropagation(); toggle(); });
  $('rp').addEventListener('click', e => { e.stopPropagation(); replay(); });
  $('mute').addEventListener('click', e => { e.stopPropagation(); AU.muted = !AU.muted; $('mute').textContent = AU.muted ? 'MUTE' : 'SND'; if (AU.ctx) seek(now()); });
  $('fs').addEventListener('click', e => { e.stopPropagation(); const d = document; if (d.fullscreenElement || d.webkitFullscreenElement) (d.exitFullscreen || d.webkitExitFullscreen).call(d); else { const r = $('stage'); (r.requestFullscreen || r.webkitRequestFullscreen || (() => { })).call(r); } });
  document.addEventListener('fullscreenchange', fit);
  cv.addEventListener('click', () => { if (state !== 'idle') toggle(); });
  frame.addEventListener('mousemove', wake); frame.addEventListener('touchstart', wake, { passive: true });
  const tr = $('track'); let drag = false;
  const seekX = x => { const r = $('rail').getBoundingClientRect(); seek(clamp((x - r.left) / r.width, 0, 1) * DURATION); if (state === 'playing' && AU.ctx) AU.t0 = AU.ctx.currentTime - pAt; };
  tr.addEventListener('pointerdown', e => { e.stopPropagation(); drag = true; tr.setPointerCapture(e.pointerId); seekX(e.clientX); });

    else if (e.key === 'ArrowLeft') { seek(now() - 5); if (state === 'playing' && AU.ctx) AU.t0 = AU.ctx.currentTime - pAt; wake(); }
